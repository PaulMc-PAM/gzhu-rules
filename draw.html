<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#2f6fed">
<title>小组抽签工具 · RosEVER_</title>
<style>
:root{
  --blue:#2f6fed; --blue-d:#1d4fc0; --blue-l:#eaf1ff; --ink:#1c2b4a;
  --ok:#1a9e6c; --card:#ffffff; --bg:#f4f7fd; --line:#d7e0f2;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px 14px 44px}
header{display:flex;align-items:center;gap:14px;margin-bottom:6px}
header img{width:60px;height:60px;border-radius:50%;border:3px solid var(--blue);object-fit:cover;background:#fff}
h1{font-size:24px;letter-spacing:1px}
.sub{color:#67718f;font-size:13px;margin-bottom:18px;text-align:center;line-height:1.7}
.sub b{color:var(--blue-d)}
.toolbar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;justify-content:center;width:100%;max-width:980px}
.btn{border:none;border-radius:10px;padding:12px 18px;font-size:15px;min-height:46px;cursor:pointer;background:#fff;color:var(--blue-d);border:1.5px solid var(--line);transition:.15s;user-select:none}
.btn:hover{border-color:var(--blue);background:var(--blue-l)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--blue);color:#fff;border-color:var(--blue-d);flex:1;max-width:200px}
.btn.primary:hover{background:var(--blue-d)}
.btn.primary:disabled{opacity:.5}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;width:100%;max-width:980px}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 4px 14px rgba(47,111,237,.08);display:flex;flex-direction:column}
.card h2{font-size:18px;display:flex;justify-content:space-between;align-items:center}
.card h2 .cnt{font-size:12px;color:#67718f;font-weight:normal}
.slot{margin:16px 0;height:72px;border-radius:12px;background:var(--blue-l);border:1.5px dashed var(--line);display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:bold;color:var(--blue-d);overflow:hidden;transition:.2s;word-break:break-all;text-align:center;padding:4px}
.slot.empty{font-size:15px;font-weight:normal;color:#8a94b3}
.slot.done{background:#e7f7f0;border:1.5px solid var(--ok);color:var(--ok);animation:pop .35s}
@keyframes pop{0%{transform:scale(.9)}60%{transform:scale(1.06)}100%{transform:scale(1)}}
.acts{display:flex;gap:8px;justify-content:center}
.names{margin-top:12px;font-size:12.5px;color:#67718f;line-height:1.9;border-top:1px solid var(--line);padding-top:10px;word-break:break-all}
.result{width:100%;max-width:980px;margin-top:20px;background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:16px 18px}
.result h3{font-size:15px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.result pre{white-space:pre-wrap;font-size:14px;line-height:2;font-family:inherit}
.modal{position:fixed;inset:0;background:rgba(20,35,70,.45);display:none;align-items:center;justify-content:center;z-index:9;padding:14px}
.modal.show{display:flex}
.box{background:#fff;border-radius:14px;padding:20px;width:min(460px,100%)}
.box h3{margin-bottom:10px}
.box textarea{width:100%;height:190px;border:1.5px solid var(--line);border-radius:10px;padding:10px;font-size:15px;resize:vertical}
.box .hint{font-size:12px;color:#67718f;margin:8px 0 12px;line-height:1.7}
footer{margin-top:26px;font-size:12px;color:#8a94b3;text-align:center;line-height:1.8}
footer b{color:var(--blue-d)}
</style>
</head>
<body>
<header>
  <img id="rose" alt="" src="">
  <h1>小组抽签工具</h1>
</header>
<div class="sub">每组随机抽 <b>1</b> 人 · 结果公平可复核（设备加密随机数）<br>首次使用：点各组「名单」粘贴导入（每行一个名字）</div>

<div class="toolbar">
  <button class="btn" onclick="openEdit('A')">A 组名单</button>
  <button class="btn" onclick="openEdit('B')">B 组名单</button>
  <button class="btn" onclick="openEdit('C')">C 组名单</button>
  <button class="btn" id="sndBtn" onclick="toggleSnd()">音效：开</button>
</div>

<div class="grid" id="grid"></div>

<div class="result">
  <h3>📋 抽签结果<button class="btn" style="padding:6px 16px" onclick="copyResult()">复制</button></h3>
  <pre id="summary">导入名单后，每组点「开始抽签」。</pre>
</div>

<div class="modal" id="modal">
  <div class="box">
    <h3 id="editTitle">编辑名单</h3>
    <textarea id="editArea" placeholder="每行一个名字"></textarea>
    <div class="hint">支持整段粘贴：自动跳过说明行（含「名单 / 排除 / 负责人」等字样和括号），自动去重、去空行。名单改动后，该组旧结果自动作废。</div>
    <div class="acts">
      <button class="btn primary" style="max-width:none;flex:1" onclick="saveEdit()">保存名单</button>
      <button class="btn" onclick="closeEdit()">取消</button>
    </div>
  </div>
</div>

<footer>
  抽签工具 · 结果仅保存在本设备，刷新后清零<br>
  Made with <b>RosEVER_</b>
</footer>

<script>
let pools = {A:[],B:[],C:[]};
let winners = {};
let sndOn = true, editKey = null, rolling = {};

/* ---------- 音效（Web Audio 零依赖，iOS 手势解锁） ---------- */
let AC = null;
function ac(){
  if(!AC) AC = new (window.AudioContext||window.webkitAudioContext)();
  if(AC.state === "suspended") AC.resume();
  return AC;
}
function beep(f, t, type, vol){
  if(!sndOn) return;
  try{
    const c = ac(), o = c.createOscillator(), g = c.createGain();
    o.type = type||"sine"; o.frequency.value = f;
    g.gain.setValueAtTime(vol||.15, c.currentTime);
    g.gain.exponentialRampToValueAtTime(.001, c.currentTime + t);
    o.connect(g); g.connect(c.destination);
    o.start(); o.stop(c.currentTime + t);
  }catch(e){}
}
function tick(){ beep(880, .04, "square", .05); }
function winChord(){
  beep(523, .18, "sine", .18);
  setTimeout(()=>beep(659, .18, "sine", .18), 120);
  setTimeout(()=>beep(784, .3,  "sine", .2),  240);
}
function toggleSnd(){ sndOn = !sndOn; document.getElementById("sndBtn").textContent = "音效：" + (sndOn?"开":"关"); }

/* ---------- 公平随机 ---------- */
function rand(n){
  const a = new Uint32Array(1);
  crypto.getRandomValues(a);
  return a[0] % n;
}

/* ---------- 渲染 ---------- */
function render(){
  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  ["A","B","C"].forEach(k=>{
    const empty = pools[k].length === 0;
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <h2>${k} 组 <span class="cnt">${empty ? "未导入名单" : pools[k].length + " 人参与"}</span></h2>
      <div class="slot ${winners[k]?"done":(empty?"empty":"")}" id="slot-${k}">${winners[k] ? "🎉 " + winners[k] : (empty ? "先点上方「" + k + " 组名单」导入" : "待抽签")}</div>
      <div class="acts">
        <button class="btn primary" onclick="draw('${k}')" ${rolling[k]||empty?"disabled":""}>${winners[k]?"重新抽":"开始抽签"}</button>
        <button class="btn" onclick="openEdit('${k}')">名单</button>
      </div>
      ${empty ? "" : '<div class="names">' + pools[k].join(" · ") + '</div>'}`;
    grid.appendChild(card);
  });
  const w = ["A","B","C"].filter(k=>winners[k]);
  document.getElementById("summary").textContent = w.length
    ? w.map(k=>`${k} 组：${winners[k]}`).join("\n") + (w.length===3 ? "\n\n（三组已抽齐，点「复制」粘贴发群）" : "\n\n（还差 " + (3-w.length) + " 组未抽）")
    : "导入名单后，每组点「开始抽签」。";
}

/* ---------- 抽签动画 ---------- */
function draw(k){
  if(rolling[k] || pools[k].length === 0) return;
  rolling[k] = true;
  render();
  const s2 = document.getElementById("slot-"+k);
  s2.classList.remove("done");
  let elapsed = 0, gap = 60;
  const total = 2600;
  (function spin(){
    if(elapsed >= total){
      winners[k] = pools[k][rand(pools[k].length)];
      rolling[k] = false;
      winChord();
      render();
      return;
    }
    s2.textContent = pools[k][rand(pools[k].length)];
    tick();
    elapsed += gap;
    gap = 60 + (elapsed/total)*160;
    setTimeout(spin, gap);
  })();
}

/* ---------- 名单导入 ---------- */
function openEdit(k){
  editKey = k;
  document.getElementById("editTitle").textContent = k + " 组名单" + (pools[k].length ? "（当前 " + pools[k].length + " 人）" : "");
  document.getElementById("editArea").value = pools[k].join("\n");
  document.getElementById("modal").classList.add("show");
}
function closeEdit(){ document.getElementById("modal").classList.remove("show"); editKey = null; }
function saveEdit(){
  const SKIP = /(名单|排除|负责人|班长|抽签|\(|（|※)/;
  const lines = document.getElementById("editArea").value
    .split(/\r?\n/).map(s=>s.trim())
    .filter(s=>s && !SKIP.test(s));
  pools[editKey] = [...new Set(lines)];
  delete winners[editKey];
  closeEdit();
  render();
}

function copyResult(){
  const t = document.getElementById("summary").textContent;
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(()=>alert("已复制，可直接粘贴发群"), fallbackCopy);
  }else{ fallbackCopy(); }
  function fallbackCopy(){
    const ta = document.createElement("textarea");
    ta.value = t; document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); alert("已复制，可直接粘贴发群"); }catch(e){ alert("复制失败，请长按手动复制"); }
    document.body.removeChild(ta);
  }
}

render();
</script>
